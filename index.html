<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NY → SF Grand Tour · Swipe Deck</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--asphalt:#26221C;--paper:#F2F4EF;--mesa:#C1502E;--pine:#37604C;--gold:#E3A73C;--ink:#5C564C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#14120E;color:#fff;
  font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif}
.display{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}

#deck{position:fixed;inset:0;touch-action:pan-y}
#track{display:flex;height:100%;will-change:transform}
.slide{position:relative;width:100vw;height:100%;flex-shrink:0;overflow:hidden}
.art{position:absolute;inset:0}
.art svg{width:100%;height:100%;position:absolute;inset:0}
img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.1s}
img.photo.ok{opacity:1}
.slide.cur img.photo.ok{animation:kb 16s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.1) translate(-1.4%,-1%)}}
.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,8,5,.92) 0%,rgba(10,8,5,.55) 34%,rgba(10,8,5,0) 62%)}

.num{position:absolute;top:calc(12px + env(safe-area-inset-top));left:16px;z-index:5;
  background:#fff;color:var(--asphalt);border:2.5px solid var(--asphalt);
  border-radius:9px 9px 15px 15px;padding:7px 12px 8px;text-align:center;line-height:1.05;
  box-shadow:0 4px 14px rgba(0,0,0,.4)}
.num b{display:block;font-size:20px}
.num span{font-size:8.5px;letter-spacing:.14em;font-weight:800;color:var(--mesa)}

.info{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:18px 20px calc(20px + env(safe-area-inset-bottom));
  text-shadow:0 1px 10px rgba(0,0,0,.6)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  padding:4px 10px;border-radius:20px;text-shadow:none}
.tag.city{background:#DCE7F2;color:#2A3A4D}
.tag.country{background:#DDEBE1;color:#2C4F3B}
.tag.road{background:#F6EEDD;color:#7a5c14}
.tag.work{background:var(--gold);color:#3d2c05}
.date{font-size:11.5px;letter-spacing:.18em;font-weight:800;color:var(--gold);margin-bottom:4px}
.info h2{font-size:clamp(24px,6vw,40px);line-height:1.05;font-weight:600}
.meta{margin-top:7px;font-size:14px}
.meta b{color:#8FD4A8}
.drive{font-size:12.5px;opacity:.85;margin-top:3px}
.note{font-size:13.5px;line-height:1.45;margin-top:9px;max-width:60ch;opacity:.95}
.stay{font-size:13px;margin-top:8px}
.stay b{color:#F2C078}
.cost{display:inline-block;margin-top:9px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);
  backdrop-filter:blur(4px);border-radius:7px;padding:6px 11px;font-size:13px;font-weight:700}
.links{margin-top:11px;display:flex;gap:18px;flex-wrap:wrap}
.links a{color:#FFB48A;font-weight:800;font-size:13.5px;text-decoration:none}
.links a.xp{color:#8FD4A8}

/* explore sheet */
#sheet{position:fixed;inset:0;z-index:40;background:rgba(8,6,4,.55);backdrop-filter:blur(2px)}
#sheet[hidden]{display:none}
#sheetCard{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:min(680px,100%);max-height:78%;
 overflow-y:auto;-webkit-overflow-scrolling:touch;background:#1D1A15;border:1px solid rgba(255,255,255,.14);border-bottom:none;
 border-radius:18px 18px 0 0;padding:20px 20px calc(26px + env(safe-area-inset-bottom))}
#sheetX{position:absolute;top:12px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.3);
 background:rgba(255,255,255,.08);color:#fff;font-size:17px;cursor:pointer;line-height:1}
#sheetCard h3{font-size:22px;font-weight:600;padding-right:44px}
#sheetCard .sec{margin-top:18px;font-size:10.5px;letter-spacing:.16em;font-weight:800;color:var(--gold);text-transform:uppercase}
.carousel{display:flex;gap:10px;overflow-x:auto;padding:10px 2px 6px;scroll-snap-type:x proximity;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.card{width:200px;flex-shrink:0;scroll-snap-align:start;background:#26221B;border:1px solid rgba(255,255,255,.12);
 border-radius:14px;overflow:hidden;text-decoration:none;color:#fff;display:block;transition:transform .15s,border-color .15s}
.card:hover{border-color:rgba(227,167,60,.7)}
.card:active{transform:scale(.97)}
.card .cimg{width:100%;height:112px;object-fit:cover;background:#2A251E;display:block}
.card .cph{width:100%;height:112px;display:flex;align-items:center;justify-content:center;font-size:32px;background:#2A251E}
.card .cb{padding:10px 12px 12px}
.card .tt{font-size:13.5px;font-weight:700;line-height:1.25}
.card .dd{font-size:11.5px;opacity:.75;line-height:1.35;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .mm{font-size:11px;font-weight:800;color:#FFB48A;margin-top:7px}

/* in-slide card rail */
.rail{display:flex;gap:8px;overflow-x:auto;touch-action:pan-x;margin-top:11px;padding:2px 2px 4px;
 scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.rcard{width:150px;flex-shrink:0;background:rgba(18,14,10,.74);border:1px solid rgba(255,255,255,.18);
 border-radius:12px;overflow:hidden;text-decoration:none;color:#fff;backdrop-filter:blur(6px);display:block;
 transition:transform .15s,border-color .15s;text-shadow:none}
.rcard:hover{border-color:rgba(227,167,60,.75)}
.rcard:active{transform:scale(.96)}
.rcard .cimg,.rcard .cph{height:80px;font-size:26px}
.rcard .rb{padding:6px 9px 8px}
.rcard .rt{font-size:11.5px;font-weight:700;line-height:1.3;height:30px;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcard .tm{display:block;color:var(--gold);font-size:9px;letter-spacing:.1em;font-weight:800;
 text-transform:uppercase;margin-bottom:3px}
@media (max-height:740px){.note{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}}

/* ambient sound + overview toggles */
#sound,#ovBtn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);
 color:#fff;cursor:pointer;backdrop-filter:blur(4px);font-size:15px;line-height:1}
#sound.on{background:var(--gold);color:#3d2c05;border-color:var(--gold)}

/* trip overview + map */
#ov{position:fixed;inset:0;z-index:45;background:#14120E;display:flex;flex-direction:column}
#ov[hidden]{display:none}
#ovHead{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
 border-bottom:1px solid rgba(255,255,255,.12);flex-shrink:0}
#ovHead b{font-size:16px}
#ovHead .sub2{font-size:11px;opacity:.6;letter-spacing:.06em}
#ovFit{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--gold);background:none;
 border:1px solid rgba(227,167,60,.5);border-radius:20px;padding:6px 11px;cursor:pointer}
#ovX{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);
 color:#fff;font-size:15px;cursor:pointer;line-height:1;flex-shrink:0}
#ovMap{height:44%;flex-shrink:0;background:#1D1A15}
.leaflet-container{background:#1D1A15;font-family:inherit}
.mk{background:var(--gold);color:#3d2c05;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;
 justify-content:center;font-weight:800;font-size:10.5px;border:2px solid #14120E;box-shadow:0 1px 6px rgba(0,0,0,.5)}
#ovList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 14px calc(20px + env(safe-area-inset-bottom))}
.oi{display:flex;gap:10px;align-items:baseline;padding:9px 2px;border-bottom:1px dashed rgba(255,255,255,.12);cursor:pointer}
.oi .oNum{font-weight:800;color:var(--gold);font-size:12px;width:24px;flex-shrink:0}
.oi .on2{font-weight:700;font-size:14px}
.oi .od{margin-left:auto;font-size:11px;opacity:.6;white-space:nowrap;padding-left:8px}
.oi:hover{background:rgba(255,255,255,.04)}
.oi.cur .on2,.oi.cur .oNum{color:#8FD4A8}

/* nav */
#hud{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:20;display:flex;gap:8px;align-items:center}
#counter{font-size:12.5px;font-weight:800;letter-spacing:.06em;background:rgba(0,0,0,.45);
  border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:6px 12px;backdrop-filter:blur(4px)}
.navbtn{position:fixed;top:50%;transform:translateY(-50%);z-index:20;width:42px;height:42px;
  border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.35);
  color:#fff;font-size:20px;font-weight:800;cursor:pointer;backdrop-filter:blur(4px)}
#prev{left:10px}#next{right:10px}
.navbtn:active{background:rgba(255,255,255,.25)}
#bar{position:fixed;left:0;bottom:0;height:4px;background:var(--gold);z-index:25;transition:width .25s ease}
.hint{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  z-index:20;font-size:10.5px;letter-spacing:.1em;opacity:.55;text-transform:uppercase;font-weight:700;pointer-events:none}

/* cover & budget */
.cover{display:flex;flex-direction:column;justify-content:center;padding:28px;position:relative;z-index:3;height:100%}
.cover .eyebrow{display:inline-block;align-self:flex-start;font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:#fff;font-weight:800;border:1.5px solid var(--gold);color:var(--gold);border-radius:3px;padding:4px 10px;margin-bottom:16px}
.cover h1{font-size:clamp(32px,8vw,58px);line-height:1.02;font-weight:600;max-width:14ch}
.cover h1 em{font-style:italic;color:#8FD4A8}
.cover p{margin-top:14px;font-size:15px;max-width:52ch;opacity:.9}
.stats{display:flex;flex-wrap:wrap;gap:22px;margin-top:22px}
.stat b{display:block;font-size:22px}
.stat span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.budget{padding:24px 22px;overflow-y:auto;height:100%;position:relative;z-index:3;-webkit-overflow-scrolling:touch}
.budget h2{font-size:clamp(26px,6vw,38px);margin:8px 0 4px}
.budget .sub{opacity:.8;font-size:13.5px;margin-bottom:16px}
.brow{display:flex;justify-content:space-between;gap:14px;padding:9px 0;font-size:14px;
  border-bottom:1px dashed rgba(255,255,255,.25)}
.brow b{white-space:nowrap;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;padding:12px 0;margin-top:6px;
  border-top:2px solid var(--gold);font-weight:800;font-size:16px}
.bwarn{background:rgba(227,167,60,.15);border:1px solid rgba(227,167,60,.5);border-radius:8px;
  padding:12px 14px;font-size:13px;margin-top:16px;line-height:1.5}
@media (prefers-reduced-motion:reduce){#track{transition:none!important}.slide.cur img.photo.ok{animation:none}}
</style>
</head>
<body>
<div id="deck">
  <div id="track"></div>
</div>
<div id="hud"><button id="ovBtn" aria-label="Trip overview and map" title="Trip overview & map">▦</button><button id="sound" aria-label="Ambient sound on/off" title="Road-trip ambience">♪</button><div id="counter">1 / 30</div></div>
<button class="navbtn" id="prev" aria-label="Previous">‹</button>
<button class="navbtn" id="next" aria-label="Next">›</button>
<div id="bar"></div>
<div class="hint">Swipe to start — music, day plan &amp; changing views per stop · ▦ map</div>

<div id="ov" hidden>
 <div id="ovHead">
  <div><b class="display">Trip overview</b><div class="sub2">NY → SF · tap a stop or a pin to jump</div></div>
  <button id="ovFit">WHOLE TRIP</button>
  <button id="ovX" aria-label="Close">✕</button>
 </div>
 <div id="ovMap"></div>
 <div id="ovList"></div>
</div>

<script>
/* ---------- poster scenes (offline fallbacks) ---------- */
function seeded(s){return()=>{s=(s*9301+49297)%233280;return s/233280}}
const CITY_PALS=[["#1B2A41","#3C5A80","#F2B04C"],["#2E3B4E","#5E7B99","#E8C97A"],["#3A2B4D","#7A567F","#F0A35E"],["#31404A","#5F7885","#EDBE6B"],["#160F2E","#4A2A7A","#FF9DE0"],["#22333B","#5E8B7E","#F4D06F"]];
function sceneCity(p=0,seed=7){const [t,b,sun]=CITY_PALS[p%CITY_PALS.length];const r=seeded(seed+p*13);let s="";
 for(let x=0;x<400;){const w=18+r()*36,h=60+r()*150,y=300-h;
  s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#12141A" opacity="${.85+r()*.15}"/>`;
  for(let wy=y+8;wy<292;wy+=14){if(r()>.45)s+=`<rect x="${x+4+r()*(w-10)}" y="${wy}" width="3.5" height="5" fill="${sun}" opacity="${.5+r()*.5}"/>`}
  x+=w+4+r()*8}
 return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="c${p}${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${t}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="400" height="300" fill="url(#c${p}${seed})"/><circle cx="320" cy="80" r="26" fill="${sun}"/>${s}<rect y="292" width="400" height="8" fill="#0C0E12"/></svg>`}
function sceneHills(seed=3){const r=seeded(seed);let o="";["#87A98F","#5F8A6C","#3F6B51","#2C4F3B"].forEach((c,i)=>{let d=`M0 ${170+i*32}`;for(let x=0;x<=400;x+=40)d+=` Q ${x+20} ${150+i*32-(10+r()*34)} ${x+40} ${170+i*32}`;d+=" L400 300 L0 300 Z";o+=`<path d="${d}" fill="${c}"/>`});
 return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="h${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6E3B4"/><stop offset="1" stop-color="#D9C08A"/></linearGradient></defs><rect width="400" height="300" fill="url(#h${seed})"/><circle cx="90" cy="70" r="30" fill="#F2A65A"/>${o}</svg>`}
function sceneDesert(white=false){const sky=white?["#BFE0F0","#8FC6E8","#F6FBFF"]:["#F7C86B","#C65A3C","#FBE2A6"];const butte=white?"#E9F2F7":"#9E3D22",butte2=white?"#D6E6F0":"#B85433",gr=white?"#F6FBFF":"#7E2F1B";
 let b="";[[40,140,60],[150,110,90],[300,150,70]].forEach(([x,y,w])=>{b+=`<path d="M${x-w/2} 240 L${x-w/2+10} ${y} L${x+w/2-10} ${y} L${x+w/2} 240 Z" fill="${butte}"/><path d="M${x-w/2+10} ${y} L${x+w/2-10} ${y} L${x+w/2-16} ${y+14} L${x-w/2+16} ${y+14} Z" fill="${butte2}"/>`});
 if(white)b=`<path d="M-20 240 Q 100 190 220 235 T 420 225 L420 300 L-20 300 Z" fill="#EDF5FA"/><path d="M-20 262 Q 140 225 420 255 L420 300 L-20 300 Z" fill="#DCEAF3"/>`;
 return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="d${white}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient></defs><rect width="400" height="300" fill="url(#d${white})"/><circle cx="200" cy="120" r="46" fill="${sky[2]}" opacity=".95"/>${b}<rect y="238" width="400" height="62" fill="${gr}" opacity="${white?0:1}"/></svg>`}
function sceneCanyon(){let s="";["#C86A3C","#B05430","#94422A","#7A3423","#5F281C"].forEach((c,i)=>{s+=`<path d="M0 ${120+i*36} C 80 ${100+i*36}, 140 ${150+i*36}, 220 ${125+i*36} S 360 ${105+i*36}, 400 ${135+i*36} L400 300 L0 300 Z" fill="${c}"/>`});
 return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="cy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBD9A0"/><stop offset="1" stop-color="#F0A867"/></linearGradient></defs><rect width="400" height="300" fill="url(#cy)"/><circle cx="330" cy="62" r="24" fill="#FFF3D6"/>${s}</svg>`}
function sceneCoast(bridge=false){const gg=bridge?`<g stroke="#C1502E" fill="none"><path d="M60 210 L60 120 M300 210 L300 120" stroke-width="10"/><path d="M0 158 Q 60 118 180 168 Q 300 118 400 150" stroke-width="5"/><path d="M0 190 H400" stroke-width="7"/></g>`:"";
 return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="o${bridge}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F9D7A8"/><stop offset="1" stop-color="#E9A97E"/></linearGradient><linearGradient id="se${bridge}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3E7C8A"/><stop offset="1" stop-color="#25525C"/></linearGradient></defs><rect width="400" height="300" fill="url(#o${bridge})"/><circle cx="110" cy="96" r="30" fill="#FBEFD2"/><rect y="210" width="400" height="90" fill="url(#se${bridge})"/>${gg}</svg>`}
function sceneFarm(){return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE3EF"/><stop offset="1" stop-color="#F3E9C8"/></linearGradient></defs><rect width="400" height="300" fill="url(#f)"/><circle cx="320" cy="66" r="26" fill="#F6D77E"/><path d="M0 200 Q 120 168 230 196 T 400 186 L400 300 L0 300 Z" fill="#8FB56F"/><path d="M0 236 Q 140 210 400 232 L400 300 L0 300 Z" fill="#6E9950"/><rect x="92" y="150" width="86" height="56" fill="#A63A2B"/><path d="M84 152 L135 118 L186 152 Z" fill="#7E2A1F"/><rect x="124" y="172" width="24" height="34" fill="#5E1F16"/></svg>`}
function scenePeaks(){return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFD5E6"/><stop offset="1" stop-color="#E8E2CF"/></linearGradient></defs><rect width="400" height="300" fill="url(#p)"/><path d="M-20 260 L110 70 L180 200 L250 60 L330 190 L420 120 L420 300 L-20 300 Z" fill="#8B909B"/><path d="M110 70 L140 120 L122 118 L108 132 L92 116 Z" fill="#F4F6F8"/><path d="M250 60 L282 120 L262 114 L248 130 L232 112 Z" fill="#F4F6F8"/><path d="M-20 300 L60 210 L150 300 Z" fill="#31543F"/><path d="M120 300 L220 200 L330 300 Z" fill="#3E6B4E"/></svg>`}
function sceneFor(s){switch(s.scene){case"city":return sceneCity(s.pal||0,(s.gm||"x").length);case"hills":return sceneHills((s.n||"").length);case"desert":return sceneDesert(false);case"dunes":return sceneDesert(true);case"canyon":return sceneCanyon();case"coast":return sceneCoast(false);case"bridge":return sceneCoast(true);case"farm":return sceneFarm();case"peaks":return scenePeaks();default:return sceneHills(5)}}

/* ---------- photos (load when environment allows; posters otherwise) ---------- */
const P={
nyc:"https://lh3.googleusercontent.com/place-photos/AJRVUZPxI-WFFDmKRqJ5f9Mvg9DfusyVlJIVLipcRVtcQqp8RfmwmxXp2a52b3brMURlXJBXG-r1zoVSUk5dSs7bXG3nF8noDNIMCwoBzwvfLKfjmyFRJEvqHlhRnyNjLctAtoVUNV980LmW4Ks52Q=s4800-w800-h600",
amish:"https://lh3.googleusercontent.com/place-photos/AJRVUZPero7Ez2VQlO87vU1OVRGa_-SANuwdGM1MWnApyP5y4FYe3G5TvoWIgOJQcSF5e7RDvzmBD-NESzRDyeYLbqSw8HzkBESXouKoRzZHSayFewYnD8BIEdcUa91G7krIzUvKY3TuN-6ANo3y=s4800-w800-h600",

// stops (slides 3..29) — each with a day-plan card rail
function hhmm(h){h=Math.max(9,Math.min(21.5,h));const H=Math.floor(h);return String(H).padStart(2,"0")+":"+(h-H>=0.5?"30":"00")}
const mapsQ=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
STOPS.forEach((s,i)=>{
 const [cls,txt]=TAGS[s.type];
 const gm=mapsQ(s.gm||s.n);
 const place=s.n.split("·")[0].trim();
 const x=EXTRAS[i]||{see:[],eat:[]},song=SONGS[i];
 const dh=s.drive?(parseFloat((s.drive.match(/([\d.]+)\s*h/)||[])[1])||3):0;
 const arriveH=s.drive?Math.min(18,9.5+dh+(dh>4?1:0.5)):15;
 const stayShort=s.stay.split("·")[0].replace(/—.*$/,"").trim();
 const prev=i>0?STOPS[i-1].n.split("·")[0].split("&")[0].trim():null;
 // build the day plan: arrive → check in → stroll → dinner → nightcap → tomorrow
 const plan=[];
 plan.push({tm:"≈ "+hhmm(arriveH),t:s.drive?`Arrive from ${prev}`:"Land in New York",src:s.img,ic:"🚗",href:gm});
 plan.push({tm:hhmm(arriveH+0.5),t:`Check in · ${stayShort}`,w:`${stayShort} ${place}`,ic:"🏨",href:s.web||mapsQ(stayShort+" "+place)});
 if(x.see[0])plan.push({tm:hhmm(Math.max(arriveH+1.5,17)),t:`First stroll · ${x.see[0].t}`,w:x.see[0].w||`${x.see[0].t} ${place}`,ic:"📍",href:mapsQ(x.see[0].t+" "+place)});
 if(x.eat[0])plan.push({tm:"19:30",t:`Dinner · ${x.eat[0].t}`,w:x.eat[0].w||`${x.eat[0].t} ${place}`,ic:"🍴",href:mapsQ(x.eat[0].t+" "+place)});
 if(x.eat[1])plan.push({tm:"21:30",t:`Nightcap · ${x.eat[1].t}`,w:x.eat[1].w||`${x.eat[1].t} ${place}`,ic:"🍸",href:mapsQ(x.eat[1].t+" "+place)});
 x.see.slice(1).forEach(c=>plan.push({tm:"☀ tomorrow",t:c.t,w:c.w||`${c.t} ${place}`,ic:"📍",bg:1,href:mapsQ(c.t+" "+place)}));
 if(x.eat[2])plan.push({tm:"☀ tomorrow",t:x.eat[2].t,w:x.eat[2].w||`${x.eat[2].t} ${place}`,ic:"🍴",href:mapsQ(x.eat[2].t+" "+place)});
 if(x.see[0])plan[2].bg=1;
 const rail=`<div class="rail" data-i="${i}">${plan.map(c=>`
   <a class="rcard" target="_blank" rel="noopener" href="${c.href}">
    ${c.src?`<img class="cimg" alt="" loading="lazy" src="${c.src}">`
          :`<img class="cimg" alt="" loading="lazy" data-w="${(c.w||"").replace(/"/g,"&quot;")}" data-ic="${c.ic}"${c.bg?' data-bg="1"':""}>`}
    <div class="rb"><span class="tm">${c.tm}</span><div class="rt">${c.ic} ${c.t}</div></div></a>`).join("")}
   ${song?`<a class="rcard" target="_blank" rel="noopener" href="https://open.spotify.com/track/${song.id}"><div class="cph">🎵</div><div class="rb"><span class="tm">soundtrack</span><div class="rt">🎵 Play "${song.t.split(" — ")[0]}"</div></div></a>`:""}
  </div>`;
 const slide=el(`<div class="slide">
  <div class="art">${sceneFor(s)}</div>
  <img class="photo" alt="" loading="lazy" decoding="async"><img class="photo" alt="" loading="lazy" decoding="async">
  <div class="shade"></div>
  <div class="num"><span>SLIDE</span><b>${i+3}</b></div>
  <div class="info">
   <div class="tags"><span class="tag ${cls}">${txt}</span>${s.work?`<span class="tag work">💼 Work day incl.</span>`:""}</div>
   <div class="date">${s.days} · ${s.dates}, 2027</div>
   <h2 class="display">${s.n}</h2>
   <div class="meta"><b>${s.nights} night${s.nights>1?"s":""}</b> · <span style="color:#F2C078">${s.cost}</span>${s.drive?`<div class="drive">↳ ${s.drive}</div>`:""}</div>
   <p class="note">${s.note}</p>
   ${rail}
   <div class="links"><a href="${gm}" target="_blank" rel="noopener">Google Maps →</a>${s.web?`<a href="${s.web}" target="_blank" rel="noopener">${s.weblabel||"Hotel website"} →</a>`:""}</div>
  </div></div>`);
 if(s.img){const im=slide.querySelectorAll('img.photo')[0];im.onload=()=>im.classList.add('ok');im.src=s.img;}
 track.appendChild(slide);
});

// budget (last slide)
track.appendChild(el(`<div class="slide"><div class="art">${sceneHills(9)}</div><div class="shade" style="background:rgba(10,8,5,.82)"></div>
 <div class="budget">
  <div class="num" style="position:static;display:inline-block;margin-bottom:10px"><span>SLIDE</span><b>${N_SLIDES}</b></div>
  <h2 class="display">The whole budget</h2>
  <p class="sub">Two people · 54 nights · Apr 20 – Jun 13, 2027 · hotel rates verified against current prices</p>
  <div class="brow"><span>Lodging — sum of all 27 stops above</span><b>$13,500–15,000</b></div>
  <div class="brow"><span>Rental car · one-way NYC→SF incl. drop fee & insurance (details: slide 2)</span><b>$3,600–4,500</b></div>
  <div class="brow"><span>Fuel · ~11,700 km</span><b>≈ $870</b></div>

  <p style="margin-top:16px;font-size:13px;opacity:.8">Feedback works by slide number — e.g. "slide 9: skip Memphis" or "slide 23: three nights in Malibu please."</p>
 </div></div>`));

/* ---------- wiki pictures: throttled (3 at a time), cached across visits ---------- */
const wikiCache=(()=>{try{return JSON.parse(localStorage.getItem('wikiThumbs')||'{}')}catch(e){return{}}})();
let wikiSaveT=null;
function wikiSave(){clearTimeout(wikiSaveT);wikiSaveT=setTimeout(()=>{
 try{localStorage.setItem('wikiThumbs',JSON.stringify(wikiCache))}catch(e){}},800)}
const fq=[];let fBusy=0;
function qFetch(url){return new Promise(res=>{fq.push({url,res});fPump()})}
function fPump(){
 while(fBusy<3&&fq.length){
  const j=fq.shift();fBusy++;
  fetch(j.url).then(r=>r.json()).then(v=>{fBusy--;j.res(v);fPump()}).catch(()=>{fBusy--;j.res(null);fPump()});
 }
}
async function wikiFill(im,icon,onUrl){
 const title=im.dataset.w;
 const fallback=()=>{const d=document.createElement('div');d.className='cph';d.textContent=icon||'📍';im.replaceWith(d)};
 im.onerror=fallback;
 try{
  let u=wikiCache[title];
  if(u===undefined){
   const q=await qFetch("https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch="
    +encodeURIComponent(title)+"&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=800&format=json&origin=*");
   const pg=q&&q.query&&q.query.pages?Object.values(q.query.pages)[0]:null;
   u=(pg&&pg.thumbnail)?pg.thumbnail.source:null;
   if(q){wikiCache[title]=u;wikiSave()} // cache only real answers, not network failures
  }
  if(u){im.src=u;onUrl&&onUrl(u)}else fallback();
 }catch(e){fallback()}
}

/* ---------- in-slide card rails: fill lazily, drift on the active slide ---------- */
const bgPools=STOPS.map(s=>s.img?[s.img]:[]);
function fillRail(si){
 if(si<0||si>=STOPS.length)return;
 const rail=track.querySelector(`.rail[data-i="${si}"]`);
 if(!rail||rail.dataset.filled)return;rail.dataset.filled=1;
 rail.querySelectorAll('img[data-w]').forEach(im=>wikiFill(im,im.dataset.ic,
  im.dataset.bg?u=>{if(bgPools[si].length<6&&!bgPools[si].includes(u))bgPools[si].push(u)}:null));
}
let railTimer=null;
function startDrift(si){
 clearInterval(railTimer);railTimer=null;
 const rail=track.querySelector(`.rail[data-i="${si}"]`);if(!rail)return;
 if(!rail.dataset.evt){
  rail.dataset.evt=1;
  rail.addEventListener('pointerdown',e=>e.stopPropagation()); // thumb-scroll the rail without swiping the deck
  ['pointerdown','wheel','touchstart'].forEach(ev=>rail.addEventListener(ev,()=>rail.dataset.pause=performance.now()+4500,{passive:true}));
 }
 let dir=1;rail.dataset.pause=performance.now()+1500;
 railTimer=setInterval(()=>{
  if(performance.now()<+rail.dataset.pause||rail.scrollWidth<=rail.clientWidth+4)return;
  rail.scrollLeft+=dir*0.5;
  if(rail.scrollLeft+rail.clientWidth>=rail.scrollWidth-1)dir=-1;
  else if(rail.scrollLeft<=0)dir=1;
 },16);
}

/* ---------- rotating background impressions on the active slide ---------- */
let rotTimer=null,rotK=0;
function startRotation(si){
 clearInterval(rotTimer);rotTimer=null;rotK=0;
 if(si<0||si>=STOPS.length)return;
 const slide=track.children[si+2];
 const layers=slide.querySelectorAll('img.photo');
 if(layers.length<2)return;
 let front=layers[1].classList.contains('ok')?1:0;
 rotTimer=setInterval(()=>{
  const pool=bgPools[si];
  if(pool.length<2)return;
  rotK=(rotK+1)%pool.length;
  const back=layers[1-front];
  back.onload=()=>{back.classList.add('ok');layers[front].classList.remove('ok');front=1-front};
  back.onerror=()=>{};
  back.src=pool[rotK];
 },5000);
}

/* ---------- trip overview + map (accessible everywhere via ▦) ---------- */
const ov=document.getElementById('ov');
let map=null;
document.getElementById('ovList').innerHTML=STOPS.map((s,i)=>
 `<div class="oi" data-i="${i}"><span class="oNum">${String(i+1).padStart(2,"0")}</span><span class="on2">${s.n}</span><span class="od">${s.dates} · ${s.nights}n</span></div>`).join("");
document.querySelectorAll('#ovList .oi').forEach(el=>el.onclick=()=>{closeOverview();go(+el.dataset.i+2)});
function openOverview(){
 ov.hidden=false;
 if(!window.L&&!map)document.getElementById('ovMap').innerHTML=
  '<div style="height:100%;display:flex;align-items:center;justify-content:center;font-size:13px;opacity:.6">Map needs a connection — the stop list below still works</div>';
 if(!map&&window.L){
  map=L.map('ovMap',{zoomControl:false});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
  L.polyline(COORDS,{color:'#E3A73C',weight:3,dashArray:'6 8',opacity:.9}).addTo(map);
  COORDS.forEach((ll,i)=>{
   L.marker(ll,{icon:L.divIcon({className:'',html:`<div class="mk">${i+1}</div>`,iconSize:[24,24],iconAnchor:[12,12]})})
    .addTo(map).bindTooltip(STOPS[i].n).on('click',()=>{closeOverview();go(i+2)});
  });
 }
 const cur=idx-2;
 document.querySelectorAll('#ovList .oi').forEach((el,i)=>el.classList.toggle('cur',i===cur));
 if(map)setTimeout(()=>{
  map.invalidateSize();
  if(cur>=0&&cur<STOPS.length)map.setView(COORDS[cur],6);
  else map.fitBounds(COORDS,{padding:[24,24]});
 },60);
 const curEl=document.querySelector('#ovList .oi.cur');
 if(curEl)setTimeout(()=>curEl.scrollIntoView({block:'center'}),80);
}
function closeOverview(){ov.hidden=true}
document.getElementById('ovBtn').onclick=()=>{ov.hidden?openOverview():closeOverview()};
document.getElementById('ovX').onclick=closeOverview;
document.getElementById('ovFit').onclick=()=>{if(map)map.fitBounds(COORDS,{padding:[24,24]})};

/* ---------- ambient audio (generated in-browser, no files) ---------- */
const soundBtn=document.getElementById('sound');
let AC=null,amb=null;
function startAmbience(){
 const ac=AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
 ac.resume();
 const g=ac.createGain();g.gain.value=0;g.connect(ac.destination);
 const nodes=[];
 // warm engine-hum chord
 [[82.4,.5,"sine"],[123.5,.3,"sine"],[164.8,.22,"triangle"],[246.9,.1,"triangle"]].forEach(([f,v,t],i)=>{
  const o=ac.createOscillator();o.type=t;o.frequency.value=f;
  const og=ac.createGain();og.gain.value=v;
  const l=ac.createOscillator();l.frequency.value=.05+i*.033;
  const lg=ac.createGain();lg.gain.value=v*.4;
  l.connect(lg);lg.connect(og.gain);o.connect(og);og.connect(g);o.start();l.start();nodes.push(o,l);
 });
 // wind: slowly-breathing filtered noise
 const len=ac.sampleRate*4,buf=ac.createBuffer(1,len,ac.sampleRate),dt=buf.getChannelData(0);
 for(let i=0;i<len;i++)dt[i]=Math.random()*2-1;
 const n=ac.createBufferSource();n.buffer=buf;n.loop=true;
 const lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=380;
 const ng=ac.createGain();ng.gain.value=.25;
 const wl=ac.createOscillator();wl.frequency.value=.06;
 const wg=ac.createGain();wg.gain.value=150;
 wl.connect(wg);wg.connect(lp.frequency);
 n.connect(lp);lp.connect(ng);ng.connect(g);n.start();wl.start();nodes.push(n,wl);
 g.gain.linearRampToValueAtTime(.11,ac.currentTime+2.5);
 return {g,nodes,ac};
}
/* ---------- road-trip radio: auto-plays the fitting song per slide ----------
   Phones only allow sound after the first touch — the first swipe/tap starts it. */
const PBASE="https://p.scdn.co/mp3-preview/";
const player=new Audio();player.loop=true;player.preload="auto";player.volume=0;
let musicOn=localStorage.getItem('deckMusicOff')!=='1',curTrack=null,fadeT=null,unlocked=false;
function paintSound(){soundBtn.classList.toggle('on',musicOn)}
function trackFor(i){const s=(i>=2&&i<STOPS.length+2)?SONGS[i-2]:ANTHEM;return s&&s.p?PBASE+s.p:null}
function fade(to,then){ // iOS ignores element volume — the time cap guarantees `then` always runs
 clearInterval(fadeT);const t0=performance.now();
 fadeT=setInterval(()=>{
  const d=to-player.volume;
  if(Math.abs(d)<=.05||performance.now()-t0>700){
   try{player.volume=to}catch(e){}
   clearInterval(fadeT);then&&then();
  }else try{player.volume=Math.max(0,Math.min(1,player.volume+Math.sign(d)*.05))}catch(e){}
 },45)}
function stopDrone(){if(amb){amb.g.gain.linearRampToValueAtTime(0,amb.ac.currentTime+.6);
 const a=amb;amb=null;setTimeout(()=>a.nodes.forEach(x=>{try{x.stop()}catch(e){}}),700)}}
function playFor(i){
 if(!musicOn||!unlocked)return;
 const u=trackFor(i);
 if(!u){if(!amb)amb=startAmbience();return}
 stopDrone();
 if(u===curTrack){if(player.paused)player.play().catch(()=>{});fade(.55);return}
 // switch immediately, inside the swipe gesture — iOS blocks delayed play() and ignores volume fades
 curTrack=u;player.src=u;
 try{player.volume=0}catch(e){}
 player.play().then(()=>fade(.55)).catch(()=>{});
}
player.onerror=()=>{if(musicOn&&unlocked&&!amb)amb=startAmbience()}; // offline fallback: generated ambience
function stopMusic(){fade(0,()=>player.pause());stopDrone()}
soundBtn.onclick=()=>{
 musicOn=!musicOn;localStorage.setItem('deckMusicOff',musicOn?'0':'1');paintSound();
 if(musicOn){unlocked=true;AC=AC||new (window.AudioContext||window.webkitAudioContext)();playFor(idx)}
 else stopMusic();
};
paintSound();
function unlock(){
 if(unlocked)return;unlocked=true;
 AC=AC||new (window.AudioContext||window.webkitAudioContext)();
 if(AC.resume)AC.resume();
 playFor(idx);
}
document.addEventListener('pointerdown',unlock);
document.addEventListener('keydown',unlock);
// safety net: if a programmatic play was ever blocked, retry inside the next touch
document.addEventListener('pointerup',()=>{
 if(musicOn&&unlocked&&player.src&&player.paused)player.play().catch(()=>{});
});

/* soft transition whoosh (only while sound is on) */
function whoosh(){
 if(!AC||!musicOn||!unlocked)return;
 const ac=AC,t=ac.currentTime,len=ac.sampleRate*0.4;
 const b=ac.createBuffer(1,len,ac.sampleRate),dt2=b.getChannelData(0);
 for(let i=0;i<len;i++)dt2[i]=(Math.random()*2-1)*(1-i/len);
 const s=ac.createBufferSource();s.buffer=b;
 const f=ac.createBiquadFilter();f.type="bandpass";f.Q.value=1.2;
 f.frequency.setValueAtTime(650,t);f.frequency.exponentialRampToValueAtTime(180,t+.35);
 const g=ac.createGain();g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);
 s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
}

/* ---------- navigation ---------- */
let idx=0,W=()=>window.innerWidth;
const counter=document.getElementById('counter'),bar=document.getElementById('bar');
function go(i,anim=true){
 const t=Math.max(0,Math.min(N_SLIDES-1,i));
 const changed=t!==idx;
 if(changed&&anim)whoosh();
 idx=t;
 [...track.children].forEach((sl,k)=>sl.classList.toggle('cur',k===idx));
 if(changed){
  playFor(idx);
  const si=idx-2;
  fillRail(si-1);fillRail(si);fillRail(si+1);
  startDrift(si);startRotation(si);
 }
 track.style.transition=anim?"transform .35s cubic-bezier(.22,.9,.3,1)":"none";
 track.style.transform=`translateX(${-idx*W()}px)`;
 counter.textContent=(idx+1)+" / "+N_SLIDES;
 bar.style.width=((idx+1)/N_SLIDES*100)+"%";
}
document.getElementById('prev').onclick=()=>go(idx-1);
document.getElementById('next').onclick=()=>go(idx+1);
document.addEventListener('keydown',e=>{if(e.key==="Escape")closeOverview();if(e.key==="ArrowRight")go(idx+1);if(e.key==="ArrowLeft")go(idx-1)});
window.addEventListener('resize',()=>go(idx,false));

// swipe
let startX=null,curX=null,dragging=false;
const deck=document.getElementById('deck');
deck.addEventListener('pointerdown',e=>{startX=curX=e.clientX;dragging=true;track.style.transition="none"});
deck.addEventListener('pointermove',e=>{if(!dragging)return;curX=e.clientX;
 track.style.transform=`translateX(${-idx*W()+(curX-startX)}px)`});
function endDrag(){if(!dragging)return;dragging=false;const dx=curX-startX;
 if(dx<-50)go(idx+1);else if(dx>50)go(idx-1);else go(idx);}
deck.addEventListener('pointerup',endDrag);deck.addEventListener('pointercancel',endDrag);

// pause animations & timers when the tab is hidden; resume on return
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){clearInterval(railTimer);clearInterval(rotTimer)}
 else{const si=idx-2;startDrift(si);startRotation(si)}
});

go(0,false);
</script>
